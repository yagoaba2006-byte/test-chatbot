<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOUCAIN</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #ffffff;
      color: #1f2937;
      min-height: 100vh;
      line-height: 1.6;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 80px 24px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }

    header img {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
    }

    header .brand {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #111827;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #111827;
    }

    p {
      font-size: 1.05rem;
      color: #4b5563;
      margin-bottom: 12px;
    }

    /* ===== Personnalisation du bouton Dify avec le toucan ===== */
    #dify-chatbot-bubble-button {
      background-color: #ffffff !important;
      background-image: url('toucan.png') !important;
      background-size: cover !important;
      background-position: center !important;
      background-repeat: no-repeat !important;
      border: 2px solid #e5e7eb !important;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15) !important;
    }

    /* On masque l'icône SVG par défaut de Dify pour ne laisser que le toucan */
    #dify-chatbot-bubble-button svg,
    #dify-chatbot-bubble-button img {
      display: none !important;
    }

    #dify-chatbot-bubble-window {
      width: 24rem !important;
      height: 40rem !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <img src="toucan.png" alt="Logo TOUCAIN" />
      <div class="brand">TOUCAIN</div>
    </header>
    <h1>Bienvenue chez TOUCAIN</h1>
    <p>Clique sur le toucan en bas à droite pour discuter avec notre assistant.</p>
  </div>

  <!-- ===== Chatbot Dify ===== -->
  <script>
    window.difyChatbotConfig = {
      token: 'hQJFpb8aoAfzj5je',
      inputs: {},
      systemVariables: {},
      userVariables: {},
    }
  </script>
  <script
    src="https://udify.app/embed.min.js"
    id="hQJFpb8aoAfzj5je"
    defer>
  </script>

</body>
</html>
